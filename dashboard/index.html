<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RewardsNext Offer Engagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>RewardsNext</h1>
      <p>Customer Offer Engagement</p>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle colour scheme">◐</button>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <h2>Filters</h2>
      <button type="button" id="resetBtn" class="linkbtn">Reset</button>
    </div>
    <div id="filters"></div>
    <div class="rail-note" id="railNote"></div>
  </aside>

  <main id="main">
    <div class="scope" id="scope"></div>
    <section id="page"></section>
  </main>
</div>

<footer class="pagefoot">
  <p>CPDA B12 Capstone · Group 3 · 17,000 customers · 306,534 events · 30-day observation window.
  Event time is hours 0–719 inside that window, not a calendar date.</p>
</footer>

<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
